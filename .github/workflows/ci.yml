# CI 门禁：模组协作 grep 禁令（issue #3）
# 规则来源：framework/docs/架构演进路线.md 第 6 节、AGENTS.md 铁律 1/2。
# 禁令 3（/root/Kernel 硬编码）已随 PluginContext 访问层（ADR-0001 / issue #2）落地转 error。
name: CI 门禁

on:
  push:
    branches: [main]
  pull_request:

jobs:
  grep-bans:
    name: grep 禁令（跨插件引用 / 内核硬编码）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 禁令1 mods/ 内禁止 preload/load 其它插件脚本
        run: |
          # 铁律1：插件不引用插件。插件脚本相对加载一律走
          # get_script().resource_path.get_base_dir().path_join(...)；
          # 硬编码 res://mods/ 或 res://plugins/ 路径即判违例。
          hits=$(grep -rnE "(preload|load)[[:space:]]*\([[:space:]]*[\"']res://(mods|plugins)/" mods --include='*.gd' || true)
          if [ -n "$hits" ]; then
            echo "::error::禁令1 违例：mods/ 内出现硬编码 res://mods|plugins 路径的 preload/load（铁律1：插件不引用插件）"
            echo "$hits"
            exit 1
          fi
          echo "禁令1 通过"

      - name: 禁令2 mods/ 内禁止跨插件相对路径 get_node
        run: |
          # 铁律1：禁止 get_node("../xxx") / $"../xxx" 跨插件访问节点。
          hits=$(grep -rnE "get_node(_or_null)?[[:space:]]*\([[:space:]]*[\"'][^\"']*\.\./" mods --include='*.gd' || true)
          hits2=$(grep -rnE '\$"[^"]*\.\./' mods --include='*.gd' || true)
          if [ -n "$hits" ] || [ -n "$hits2" ]; then
            echo "::error::禁令2 违例：mods/ 内出现跨插件相对路径节点访问（铁律1：插件不引用插件）"
            echo "$hits"
            echo "$hits2"
            exit 1
          fi
          echo "禁令2 通过"

      - name: 禁令3 mods/ 与 core/ 内禁止硬编码 /root/Kernel
        run: |
          # 铁律2：服务只从访问层获取（PluginContext，ADR-0001）。
          # 白名单：src/ 引导壳（main.gd 负责装配内核本体，属基础设施而非插件代码）。
          hits=$(grep -rn "/root/Kernel" mods core --include='*.gd' || true)
          if [ -n "$hits" ]; then
            echo "::error::禁令3 违例：mods/ 或 core/ 内硬编码 /root/Kernel（铁律2：服务只从访问层获取）"
            echo "$hits"
            exit 1
          fi
          echo "禁令3 通过"

      - name: 附加检查 core/ 不得认识具体插件
        run: |
          # 内核零插件可启动：core/ 代码不得出现任何具体插件 id 字符串。
          # 新增插件 id 时在此追加（维护点；仅限真实存在的 mods/ 插件目录名）。
          ids='streaming_arena|control_panel_base|scene_manager_panel|test_pair_a|test_pair_b'
          hits=$(grep -rnE "$ids" core --include='*.gd' || true)
          if [ -n "$hits" ]; then
            echo "::error::附加违例：core/ 内出现具体插件 id 字符串（内核不得认识任何具体插件）"
            echo "$hits"
            exit 1
          fi
          echo "附加检查 通过"

  contract-tests:
    name: 契约测试（无头）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Godot 4.5.1
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64

      - name: 导入项目资源（生成全局类缓存）
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --import

      - name: 运行契约测试（tests/，ADR-0003）
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . res://tests/test_main.tscn

  export-mods-parity:
    name: 插件打包排除规则（.sh / .ps1）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装打包依赖
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: 夹具验证 .sh：_ 前缀 / 无清单 / .godot 排除
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/mod-fixture"
          rm -rf "$fixture"
          mkdir -p "$fixture/mods/_skip" "$fixture/mods/valid/scripts" "$fixture/mods/valid/.godot" "$fixture/mods/no_manifest"
          cp export_mods.sh "$fixture/"
          printf '%s\n' '{"id":"skip","version":"1.0.0"}' > "$fixture/mods/_skip/plugin.json"
          printf '%s\n' '{"id":"valid","version":"1.0.0"}' > "$fixture/mods/valid/plugin.json"
          touch "$fixture/mods/valid/scripts/a.gd" "$fixture/mods/valid/.godot/cache.bin"

          out="$(cd "$fixture" && bash ./export_mods.sh)"
          echo "$out"

          test -f "$fixture/builds/mods/valid_1.0.0.zip"
          test ! -e "$fixture/builds/mods/skip_1.0.0.zip"
          test ! -e "$fixture/builds/mods/no_manifest_1.0.0.zip"
          test "$(find "$fixture/builds/mods" -name '*.zip' | wc -l)" -eq 1

          echo "$out" | grep -q '跳过（模板/测试目录）: _skip'
          echo "$out" | grep -q '跳过（无 plugin.json）: no_manifest'
          unzip -Z1 "$fixture/builds/mods/valid_1.0.0.zip" | grep -q '^valid/'
          if unzip -Z1 "$fixture/builds/mods/valid_1.0.0.zip" | grep -q '\.godot/cache.bin'; then
            echo '错误：.sh 产物包含 .godot 缓存' >&2
            exit 1
          fi

      - name: 夹具验证 .ps1：_ 前缀 / 无清单 / .godot 排除
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/mod-fixture-ps"
          rm -rf "$fixture"
          mkdir -p "$fixture/mods/_skip" "$fixture/mods/valid/scripts" "$fixture/mods/valid/.godot" "$fixture/mods/no_manifest"
          cp export_mods.ps1 "$fixture/"
          printf '%s\n' '{"id":"skip","version":"1.0.0"}' > "$fixture/mods/_skip/plugin.json"
          printf '%s\n' '{"id":"valid","version":"1.0.0"}' > "$fixture/mods/valid/plugin.json"
          touch "$fixture/mods/valid/scripts/a.gd" "$fixture/mods/valid/.godot/cache.bin"

          (cd "$fixture" && pwsh -NoProfile -File ./export_mods.ps1)

          test -f "$fixture/builds/mods/valid_1.0.0.zip"
          test ! -e "$fixture/builds/mods/skip_1.0.0.zip"
          test ! -e "$fixture/builds/mods/no_manifest_1.0.0.zip"
          test "$(find "$fixture/builds/mods" -name '*.zip' | wc -l)" -eq 1
          unzip -Z1 "$fixture/builds/mods/valid_1.0.0.zip" | grep -q '^valid/'
          if unzip -Z1 "$fixture/builds/mods/valid_1.0.0.zip" | grep -q '\.godot/cache.bin'; then
            echo '错误：.ps1 产物包含 .godot 缓存' >&2
            exit 1
          fi
